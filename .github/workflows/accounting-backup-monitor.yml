name: Accounting Backup Monitor (Read Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

concurrency:
  group: accounting-backup-monitor
  cancel-in-progress: false

jobs:
  verify-backups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check local backup, encrypted upload and timers without exposing private data
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: AUDIT_SHA
          command_timeout: 7m
          script: |
            set -euo pipefail
            umask 077
            set +x
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SOURCE=/opt/accounting-program-online
            git -C "$SOURCE" fetch --no-tags origin main
            git -C "$SOURCE" cat-file -e "$AUDIT_SHA^{commit}"
            git -C "$SOURCE" merge-base --is-ancestor "$AUDIT_SHA" origin/main
            audit_file="$(mktemp /tmp/accounting-backup-monitor.XXXXXXXX.py)"
            trap 'rm -f "$audit_file"' EXIT
            git -C "$SOURCE" show "$AUDIT_SHA:scripts/dr/accounting_backup_monitor.py" > "$audit_file"
            test -s "$audit_file"
            python3 -B "$audit_file"
        env:
          AUDIT_SHA: ${{ github.sha }}
