name: Beds24 historical status audit

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum new Beds24 IDs to check (start with 100)
        required: true
        type: string
        default: '100'
      delay_seconds:
        description: Minimum delay between API requests
        required: true
        type: string
        default: '2'
      start_after_id:
        description: Optional cursor; normally leave blank for automatic CSV resumption
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: accounting-beds24-historical-audit
  cancel-in-progress: false

jobs:
  audit:
    # Never execute a non-main revision using credentials for the production server.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Execute read-only audit on existing Accounting server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          AUDIT_SHA: ${{ github.sha }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          START_AFTER_ID: ${{ inputs.start_after_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 150m
          envs: AUDIT_SHA,MAX_REQUESTS,DELAY_SECONDS,START_AFTER_ID
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            [[ "$AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$MAX_REQUESTS" =~ ^[0-9]+$ ]] && (( MAX_REQUESTS >= 1 && MAX_REQUESTS <= 1600 ))
            [[ "$DELAY_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]]
            [[ -z "$START_AFTER_ID" || "$START_AFTER_ID" =~ ^[0-9]+$ ]]

            SOURCE=/opt/accounting-program-online
            CURRENT=/opt/accounting-current/backend
            STATE=/var/lib/hiddenoasis/accounting-beds24-audit
            test -d "$SOURCE/.git"
            test -x "$CURRENT/.venv/bin/python"
            test -f /etc/hiddenoasis/accounting-backend.env
            git -C "$SOURCE" fetch --no-tags origin main
            git -C "$SOURCE" cat-file -e "$AUDIT_SHA^{commit}"
            git -C "$SOURCE" merge-base --is-ancestor "$AUDIT_SHA" origin/main

            install -d -m 0700 "$STATE"
            exec 9>"$STATE/.lock"
            flock -n 9 || { echo "Beds24 historical audit is already running"; exit 1; }
            SCRIPT="$STATE/audit-$AUDIT_SHA.py"
            git -C "$SOURCE" show "$AUDIT_SHA:backend/scripts/audit_beds24_statuses.py" > "$SCRIPT"
            chmod 0600 "$SCRIPT"

            set -a
            . /etc/hiddenoasis/accounting-backend.env
            set +a
            cd "$CURRENT"
            export PYTHONPATH="$CURRENT"

            "$CURRENT/.venv/bin/python" "$SCRIPT" \
              --output "$STATE/statuses.csv" \
              --max-requests "$MAX_REQUESTS" \
              --delay "$DELAY_SECONDS" \
              --start-after-id "$START_AFTER_ID"

            echo "Audit results are stored on the Accounting server at $STATE/statuses.csv"
