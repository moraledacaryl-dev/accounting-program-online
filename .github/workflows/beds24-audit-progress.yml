name: Beds24 historical audit progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-audit-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize protected server-side audit CSV (no booking details)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            REPORT=/var/lib/hiddenoasis/accounting-beds24-audit/statuses.csv
            MARKER=/var/lib/hiddenoasis/accounting-beds24-audit/statuses.csv.complete
            test -f "$REPORT" || { echo "AUDIT_PROGRESS: no server-side report yet"; exit 1; }
            CURRENT=/opt/accounting-current/backend
            test -x "$CURRENT/.venv/bin/python"
            export PYTHONPATH="$CURRENT"
            REPORT="$REPORT" MARKER="$MARKER" "$CURRENT/.venv/bin/python" - <<'PY'
            import csv
            import os
            from collections import Counter
            from datetime import datetime, timezone
            from pathlib import Path
            from app.services.beds24_sync_service import _map_status

            report = Path(os.environ["REPORT"])
            known = {
                "MATCHED",
                "CANCELLATION_MISMATCH",
                "OTHER_STATUS_MISMATCH",
                "MISSING_IN_BEDS24",
                "DUPLICATE_LINK",
                "DUPLICATE_REMOTE",
                "API_ERROR",
            }
            latest = {}
            with report.open(newline="") as handle:
                for row in csv.DictReader(handle):
                    if not row or row.get("classification") not in known:
                        continue
                    booking_id = str(row.get("beds24_booking_id") or "").strip()
                    if booking_id.isdigit():
                        latest[booking_id] = row
            def mapped_classification(row):
                original = row["classification"]
                if original != "OTHER_STATUS_MISMATCH":
                    return original
                raw_status = str(row.get("beds24_status") or "").strip().lower()
                if not raw_status:
                    return "API_ERROR"
                local_status = str(row.get("accounting_status") or "").strip().lower()
                normalized = _map_status(raw_status)
                if normalized == "cancelled" and local_status not in {"cancelled", "canceled"}:
                    return "CANCELLATION_MISMATCH"
                if normalized == local_status or (normalized == "cancelled" and local_status in {"cancelled", "canceled"}):
                    return "STATUS_ALIAS_MATCH"
                return "OTHER_STATUS_MISMATCH"

            raw_counts = Counter(row["classification"] for row in latest.values())
            counts = Counter(mapped_classification(row) for row in latest.values())
            verified = sum(value for key, value in counts.items() if key != "API_ERROR")
            issues = sum(value for key, value in counts.items() if key not in {"MATCHED", "STATUS_ALIAS_MATCH", "API_ERROR"})
            timestamp = datetime.fromtimestamp(report.stat().st_mtime, tz=timezone.utc).isoformat()
            print("AUDIT_PROGRESS: report_updated_utc=" + timestamp)
            print(f"AUDIT_PROGRESS: distinct_rows={len(latest)} inspected={verified} needs_review={issues}")
            print(f"AUDIT_PROGRESS: raw_other_status_mismatch={raw_counts['OTHER_STATUS_MISMATCH']}")
            print("AUDIT_PROGRESS: STATUS_ALIAS_MATCH means a raw status alias matches; historical subStatus was not captured")
            for key in sorted(counts):
                print(f"AUDIT_PROGRESS: {key}={counts[key]}")
            # Only internal booking IDs and constrained status tokens; no guest
            # identities or financial values are included in Actions logs.
            def safe_status(value):
                value = str(value or "").strip().lower()
                return "".join(ch for ch in value if ch.isalnum() or ch in "_-")[:32] or "none"

            exceptions = [
                row for row in latest.values()
                if mapped_classification(row) in {"OTHER_STATUS_MISMATCH", "CANCELLATION_MISMATCH"}
            ]
            pairs = Counter(
                (safe_status(row.get("accounting_status")), safe_status(row.get("beds24_status")))
                for row in exceptions
            )
            for (local, remote), value in sorted(pairs.items()):
                print(f"AUDIT_EXCEPTION_PAIR: accounting={local} beds24={remote} count={value}")
            for row in exceptions[:25]:
                print(
                    f"AUDIT_EXCEPTION: beds24_id={row['beds24_booking_id']} "
                    f"accounting_id={row.get('accounting_booking_id')} "
                    f"classification={mapped_classification(row)} "
                    f"accounting_status={safe_status(row.get('accounting_status'))} "
                    f"beds24_status={safe_status(row.get('beds24_status'))}"
                )
            if len(exceptions) > 25:
                print(f"AUDIT_EXCEPTION: further_count={len(exceptions) - 25}")
            print("AUDIT_PROGRESS: completion_marker=" + str(Path(os.environ["MARKER"]).is_file()).lower())
            PY
