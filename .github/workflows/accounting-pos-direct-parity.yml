name: Accounting POS Direct ERP Parity (Read Only)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dr/pos-direct-erp-evidence.py'
      - 'scripts/dr/pos_sale_evidence.py'
      - '.github/workflows/accounting-pos-direct-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-pos-direct-parity
  cancel-in-progress: false

jobs:
  audit-pos-direct-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Compare POS direct Accounting transaction identities without exposing them
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 13m
          envs: AUDIT_SHA
          script: |
            set -euo pipefail
            umask 077
            set +x
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SOURCE=/opt/accounting-program-online
            CURRENT=/opt/accounting-current
            test -L "$CURRENT"
            test -x "$CURRENT/backend/.venv/bin/python"
            test -f /etc/hiddenoasis/accounting-backend.env
            test -f /etc/hiddenoasis/pos-backend.env
            git -C "$SOURCE" fetch --no-tags origin main
            git -C "$SOURCE" cat-file -e "$AUDIT_SHA^{commit}"
            git -C "$SOURCE" merge-base --is-ancestor "$AUDIT_SHA" origin/main
            # The POS auditor imports a sibling sale/void evidence module.
            # Stage *both* exact-SHA files privately, never from mutable main.
            audit_dir="$(mktemp -d /tmp/accounting-pos-direct-parity.XXXXXXXX)"
            audit_file="$audit_dir/pos-direct-erp-evidence.py"
            helper_file="$audit_dir/pos_sale_evidence.py"
            trap 'rm -f "$audit_file" "$helper_file"; rmdir "$audit_dir"' EXIT
            git -C "$SOURCE" show "$AUDIT_SHA:scripts/dr/pos-direct-erp-evidence.py" > "$audit_file"
            git -C "$SOURCE" show "$AUDIT_SHA:scripts/dr/pos_sale_evidence.py" > "$helper_file"
            test -s "$audit_file"
            test -s "$helper_file"
            # Retain credentials only in the protected server process.
            set -a
            . /etc/hiddenoasis/accounting-backend.env
            ACCOUNTING_AUDIT_DATABASE_URL="$DATABASE_URL"
            . /etc/hiddenoasis/pos-backend.env
            POS_AUDIT_DATABASE_URL="$DATABASE_URL"
            set +a
            export ACCOUNTING_AUDIT_DATABASE_URL POS_AUDIT_DATABASE_URL
            # Do not create __pycache__ in the private temporary audit directory.
            "$CURRENT/backend/.venv/bin/python" -B "$audit_file"
        env:
          AUDIT_SHA: ${{ github.sha }}
