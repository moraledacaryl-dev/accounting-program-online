name: One-time Accounting Certified Production Release

# Adding this workflow to main is the single authorized trigger.
# It will not run for unrelated commits or later app changes.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/accounting-certified-one-time-release.yml

permissions:
  contents: read
  actions: read

jobs:
  await-ci:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.pin.outputs.release_sha }}
    steps:
      - name: Pin this main release SHA
        id: pin
        shell: bash
        env:
          PIN: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANCH" == main ]]
          printf 'release_sha=%s\n' "$PIN" >> "$GITHUB_OUTPUT"

      - name: Wait for successful exact-main push CI without relaxing any gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Never deploy a stale release if another main commit supersedes it.
          for attempt in $(seq 1 40); do
            main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
            if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
              echo "Main advanced beyond pinned release; fail closed." >&2
              exit 1
            fi

            # GitHub's head_sha/event run filters have previously returned
            # empty false negatives. Fetch unfiltered CI history and validate
            # exact SHA, branch, event, completion, and conclusion locally.
            run_json="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?per_page=100")"
            ci_state="$(jq -er --arg sha "$RELEASE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha
                  and .head_branch == "main" and .event == "push")] |
              if any(.[]; .status == "completed" and .conclusion == "success") then "success"
              elif any(.[]; .status == "completed" and .conclusion != "success") then "failed"
              else "pending" end
            ' <<< "$run_json")"

            case "$ci_state" in
              success)
                echo "Exact-main CI verified for $RELEASE_SHA"
                exit 0
                ;;
              failed)
                echo "Exact-main CI failed; production deployment blocked." >&2
                exit 1
                ;;
              pending)
                echo "Awaiting exact-main CI evidence (attempt $attempt/40)."
                sleep 30
                ;;
              *)
                echo "Unrecognized CI state; production deployment blocked." >&2
                exit 1
                ;;
            esac
          done
          echo "Exact-main CI evidence timed out; deployment blocked." >&2
          exit 1

  deploy-accounting:
    needs: await-ci
    uses: ./.github/workflows/deploy-accounting.yml
    with:
      release_sha: ${{ needs.await-ci.outputs.release_sha }}
    secrets: inherit
