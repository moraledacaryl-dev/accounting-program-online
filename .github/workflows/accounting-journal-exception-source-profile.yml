name: Accounting Journal Exception Source Profile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dr/journal-exception-source-profile.py'
      - '.github/workflows/accounting-journal-exception-source-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-journal-source-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run read-only journal origin and overlap aggregate profiling
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: AUDIT_SHA
          command_timeout: 7m
          script: |
            set -euo pipefail
            umask 077
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SOURCE=/opt/accounting-program-online
            CURRENT=/opt/accounting-current
            test -L "$CURRENT"
            test -x "$CURRENT/backend/.venv/bin/python"
            test -f /etc/hiddenoasis/accounting-backend.env
            git -C "$SOURCE" fetch --no-tags origin main
            git -C "$SOURCE" cat-file -e "$AUDIT_SHA^{commit}"
            git -C "$SOURCE" merge-base --is-ancestor "$AUDIT_SHA" origin/main
            SCRIPT_FILE="$(mktemp /tmp/accounting-journal-origin.XXXXXXXX.py)"
            trap 'rm -f "$SCRIPT_FILE"' EXIT
            git -C "$SOURCE" show "$AUDIT_SHA:scripts/dr/journal-exception-source-profile.py" > "$SCRIPT_FILE"
            test -s "$SCRIPT_FILE"
            set -a
            . /etc/hiddenoasis/accounting-backend.env
            set +a
            "$CURRENT/backend/.venv/bin/python" "$SCRIPT_FILE"
            echo "JOURNAL ORIGIN READ-ONLY PROFILE: PASS"
        env:
          AUDIT_SHA: ${{ github.sha }}
