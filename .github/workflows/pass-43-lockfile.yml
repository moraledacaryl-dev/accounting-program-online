name: Pass 43 lockfile refresh

on:
  push:
    branches:
      - pass-43-nextjs-security-closure

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate dependency lock atomically
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install next@15.5.22 --save-exact --package-lock-only
          npm ci
          npm run qa:ui
          rm -rf .next
          npm run build
          npm audit --omit=dev

      - name: Commit generated dependency files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "security: upgrade Next.js maintenance LTS to 15.5.22"
          git push origin "HEAD:${GITHUB_REF_NAME}"
