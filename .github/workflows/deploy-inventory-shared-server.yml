name: One-time Inventory Group E Scoped API Certified Release

# Temporary authorized-credentials bridge; retire after verified Inventory deployment.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-inventory-shared-server.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: inventory-one-time-shared-server
  cancel-in-progress: false

jobs:
  certify-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact Inventory main SHA and all five successful push gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO=moraledacaryl-dev/inventory-procurement
          RELEASE_SHA=1abfc8776ded3ede9f5c21aeef6483e079e27993
          expected=('CI' 'Browser Acceptance' 'Resilience Assurance' 'Deployment Validation' 'Native Deployment Validation')
          for attempt in $(seq 1 40); do
            main_sha="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
            [[ "$main_sha" == "$RELEASE_SHA" ]] || {
              echo "Inventory main changed; refusing stale release." >&2
              exit 1
            }
            # Read complete exact-SHA push run records; PR results do not count.
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" --jq '.workflow_runs | map({name, event, head_sha, status, conclusion})')"
            missing=()
            for gate in "${expected[@]}"; do
              passed="$(jq -r --arg name "$gate" --arg sha "$RELEASE_SHA" '[.[] | select(.name == $name and .event == "push" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length' <<< "$runs")"
              if ((passed < 1)); then missing+=("$gate"); fi
            done
            if (( ${#missing[@]} == 0 )); then
              echo "INVENTORY EXACT-SHA CERTIFICATION: PASS | $RELEASE_SHA | all five push gates"
              exit 0
            fi
            echo "Awaiting exact main gates: ${missing[*]} (attempt $attempt/40)"
            sleep 15
          done
          echo "No release: required exact-SHA main push gates not all successful" >&2
          exit 1

  deploy:
    needs: certify-inventory
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Inventory using retained server credentials and native backup gate
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ROOT=/opt/inventory-procurement-online
            RELEASE_SHA=1abfc8776ded3ede9f5c21aeef6483e079e27993
            test -d "$ROOT/.git"
            git -C "$ROOT" fetch --no-tags origin main
            temp_script="/tmp/inventory-release-$RELEASE_SHA-$$.sh"
            trap 'rm -f "$temp_script"' EXIT
            git -C "$ROOT" show "$RELEASE_SHA:deploy/release-native.sh" > "$temp_script"
            chmod 700 "$temp_script"
            if [ "$(id -u)" = "0" ]; then
              bash "$temp_script" "$RELEASE_SHA"
            else
              sudo -n bash "$temp_script" "$RELEASE_SHA"
            fi
            bash -c "cd '$ROOT/backend' && set -a && source /etc/hiddenoasis/inventory-backend.env && set +a && .venv/bin/python -m scripts.audit_requisition_locations"
            curl --retry 5 --retry-delay 2 -fsS http://127.0.0.1:8300/api/v1/ready
            curl --retry 5 --retry-delay 2 -fsS http://127.0.0.1:3300/login >/dev/null
            curl --retry 5 --retry-delay 2 -fsS https://inventory.hiddenoasis.app/login >/dev/null
            echo "INVENTORY SHARED-SERVER DEPLOYMENT: VERIFIED | $RELEASE_SHA"
