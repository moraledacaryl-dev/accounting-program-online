name: One-time Inventory Group G Staff Workflow Certified Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-inventory-shared-server.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: inventory-one-time-shared-server
  cancel-in-progress: false

jobs:
  certify-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact Inventory main SHA and five successful push gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO=moraledacaryl-dev/inventory-procurement
          RELEASE_SHA=a41e88a579c0e131d0295f8f4023870b38f61536
          required=('CI' 'Browser Acceptance' 'Resilience Assurance' 'Deployment Validation' 'Native Deployment Validation')
          for attempt in $(seq 1 48); do
            main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            [[ "$main_sha" == "$RELEASE_SHA" ]] || {
              echo "Inventory main changed; refusing stale release" >&2
              exit 1
            }
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" --jq '.workflow_runs | map({name,event,head_sha,status,conclusion})')"
            pending=()
            for name in "${required[@]}"; do
              count="$(jq -r --arg name "$name" --arg sha "$RELEASE_SHA" '[.[] | select(.name == $name and .event == "push" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length' <<< "$runs")"
              if ((count < 1)); then pending+=("$name"); fi
            done
            if (( ${#pending[@]} == 0 )); then
              echo "INVENTORY GROUP G CERTIFICATION: PASS | $RELEASE_SHA | five exact-main gates"
              exit 0
            fi
            echo "Awaiting exact main: ${pending[*]} attempt $attempt/48"
            sleep 15
          done
          echo "Required exact-SHA Inventory main checks unavailable; refusing deploy" >&2
          exit 1

  deploy:
    needs: certify-inventory
    runs-on: ubuntu-latest
    steps:
      - name: Native deployment with mandatory production backup and readiness proof
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ROOT=/opt/inventory-procurement-online
            RELEASE_SHA=a41e88a579c0e131d0295f8f4023870b38f61536
            test -d "$ROOT/.git"
            git -C "$ROOT" fetch --no-tags origin main
            script="/tmp/inventory-release-$RELEASE_SHA-$$.sh"
            trap 'rm -f "$script"' EXIT
            git -C "$ROOT" show "$RELEASE_SHA:deploy/release-native.sh" > "$script"
            chmod 700 "$script"
            if [ "$(id -u)" = 0 ]; then
              bash "$script" "$RELEASE_SHA"
            else
              sudo -n bash "$script" "$RELEASE_SHA"
            fi
            curl --retry 5 --retry-delay 2 -fsS http://127.0.0.1:8300/api/v1/ready
            curl --retry 5 --retry-delay 2 -fsS http://127.0.0.1:3300/login >/dev/null
            curl --retry 5 --retry-delay 2 -fsS https://inventory.hiddenoasis.app/login >/dev/null
            echo "INVENTORY SHARED-SERVER DEPLOYMENT: VERIFIED | $RELEASE_SHA"
