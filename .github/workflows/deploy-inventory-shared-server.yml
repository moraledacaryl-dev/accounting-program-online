name: One-time Inventory Procurement Location Scope Certified Release

# Temporary credential bridge: both applications share the authorized server.
# This workflow runs only when this file is added/changed on Accounting main.
# Remove it after a verified Inventory deployment.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-inventory-shared-server.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: inventory-one-time-shared-server
  cancel-in-progress: false

jobs:
  certify-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact Inventory main SHA and all successful quality gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=moraledacaryl-dev/inventory-procurement
          RELEASE_SHA=2cdfdb18f4a71dbbe69be558c9b918085b36918c
          main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "Inventory main changed; refusing the stale one-time deployment." >&2
            exit 1
          }
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" --jq '.workflow_runs | map({name, status, conclusion})')"
          for gate in "CI" "Browser Acceptance" "Resilience Assurance" "Deployment Validation" "Native Deployment Validation"; do
            passed="$(jq -r --arg gate "$gate" '[.[] | select(.name == $gate and .status == "completed" and .conclusion == "success")] | length' <<< "$runs")"
            [[ "$passed" -gt 0 ]] || {
              echo "Inventory SHA missing successful push quality gate: $gate" >&2
              exit 1
            }
          done
          echo "All five Inventory gates verified for exact SHA $RELEASE_SHA"

  deploy:
    needs: certify-inventory
    runs-on: ubuntu-latest
    steps:
      - name: Deploy certified Inventory release using existing server credentials
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ROOT=/opt/inventory-procurement-online
            RELEASE_SHA=2cdfdb18f4a71dbbe69be558c9b918085b36918c
            test -d "$ROOT/.git"
            git -C "$ROOT" fetch --no-tags origin main
            temp_script="/tmp/inventory-release-$RELEASE_SHA-$$.sh"
            trap 'rm -f "$temp_script"' EXIT
            git -C "$ROOT" show "$RELEASE_SHA:deploy/release-native.sh" > "$temp_script"
            chmod 700 "$temp_script"
            if [ "$(id -u)" = "0" ]; then
              bash "$temp_script" "$RELEASE_SHA"
            else
              sudo -n bash "$temp_script" "$RELEASE_SHA"
            fi
            curl -fsS http://127.0.0.1:8300/api/v1/ready
            curl -fsS http://127.0.0.1:3300/login >/dev/null
            curl -fsS https://inventory.hiddenoasis.app/login >/dev/null
            echo "INVENTORY SHARED-SERVER DEPLOYMENT: VERIFIED | $RELEASE_SHA"
