name: Deploy Accounting

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character commit SHA from main to deploy'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  certify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release SHA input
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Require successful CI for exact release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          commit_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_SHA" --jq '.sha')"
          [[ "$commit_sha" == "$RELEASE_SHA" ]]

          main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          comparison="$(gh api "repos/$GH_REPO/compare/$RELEASE_SHA...$main_sha" --jq '.status')"
          case "$comparison" in
            identical|ahead) ;;
            *)
              echo "Release SHA is not on main: compare status=$comparison" >&2
              exit 1
              ;;
          esac

          # GitHub Actions sometimes returns an empty run list when
          # head_sha/event are supplied as API filters even though the exact
          # successful run appears in the normal workflow history. Query
          # unfiltered CI history, and validate EVERY property ourselves.
          # Bound traversal to five pages; absence is a hard release block.
          for page in 1 2 3 4 5; do
            runs_json="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?per_page=100&page=$page")"
            run_ids="$(jq -r --arg sha "$RELEASE_SHA" '
              .workflow_runs[]
              | select(.head_sha == $sha
                  and .event == "push"
                  and .head_branch == "main"
                  and .status == "completed"
                  and .conclusion == "success")
              | .id
            ' <<< "$runs_json")"

            if [[ -n "$run_ids" ]]; then
              run_id="${run_ids%%$'\n'*}"
              [[ "$run_id" =~ ^[0-9]+$ ]]
              echo "Certified exact release SHA $RELEASE_SHA by successful main-branch push CI run $run_id"
              exit 0
            fi

            count="$(jq -er '.workflow_runs | if type == "array" then length else error("Invalid CI workflow response") end' <<< "$runs_json")"
            [[ "$count" =~ ^[0-9]+$ ]]
            if (( count < 100 )); then
              break
            fi
          done

          echo "Exact release SHA $RELEASE_SHA has no verified completed successful main push CI run in bounded history" >&2
          exit 1

  deploy:
    needs: certify-release
    runs-on: ubuntu-latest

    steps:
      - name: Prepare and activate exact release on server
        # v1.0.3 pinned to an immutable upstream commit for supply-chain integrity.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: RELEASE_SHA
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            umask 077
            install -d -m 0700 /run/hiddenoasis-accounting-release
            exec 200>/run/hiddenoasis-accounting-release/deployment.lock
            flock -n 200 || { echo 'Accounting release or backup is already running.' >&2; exit 75; }
            export ACCOUNTING_RELEASE_LOCK_HELD=1
            ROOT=/opt/accounting-program-online
            git -C "$ROOT" fetch --no-tags origin main
            git -C "$ROOT" cat-file -e "$RELEASE_SHA^{commit}"
            git -C "$ROOT" merge-base --is-ancestor "$RELEASE_SHA" origin/main
            # Disk exhaustion previously blocked pg_dump after an expensive build.
            # Check capacity and a writable primary before any prepare or activation.
            BACKUPS=/var/backups/hiddenoasis/accounting
            mkdir -p "$BACKUPS"
            FREE_BYTES="$(df -B1 --output=avail "$BACKUPS" | tail -n 1 | tr -d ' ')"
            echo "Available bytes for mandatory database backup: $FREE_BYTES"
            if [ "$FREE_BYTES" -lt 4294967296 ]; then
              echo "Deployment blocked: less than 4 GiB available; preserve backups and free space safely." >&2
              exit 1
            fi
            pg_isready -h 127.0.0.1 -p 5432
            IN_RECOVERY="$(sudo -u postgres psql -d postgres -Atqc 'SELECT pg_is_in_recovery()')"
            if [ "$IN_RECOVERY" != "f" ]; then
              echo "Deployment blocked: PostgreSQL not confirmed as writable primary." >&2
              exit 1
            fi

            RELEASE="/opt/accounting-releases/$RELEASE_SHA"
            if [ -e "$RELEASE" ] || [ -L "$RELEASE" ]; then
              # The previous deployment may have built the complete immutable
              # release but failed at its mandatory pre-activation backup.
              # Never overwrite or erase it. Only reuse an exact, fully
              # verified SHA/config/dependency/build artifact.
              test -d "$RELEASE"
              test ! -L "$RELEASE"
              echo "Prepared release already exists; verifying exact identity without rebuilding."
              bash "$RELEASE/scripts/release/verify-release.sh" "$RELEASE_SHA"
            else
              BOOTSTRAP="/tmp/accounting-prepare-release-$RELEASE_SHA.sh"
              trap 'rm -f "$BOOTSTRAP"' EXIT
              git -C "$ROOT" show "$RELEASE_SHA:scripts/release/prepare-release.sh" > "$BOOTSTRAP"
              chmod 700 "$BOOTSTRAP"
              SOURCE_ROOT="$ROOT" bash "$BOOTSTRAP" "$RELEASE_SHA"
              rm -f "$BOOTSTRAP"
              trap - EXIT
            fi
            # activate-release.sh independently verifies the SHA and always
            # runs the mandatory database + uploads backup before migration.
            bash "$RELEASE/scripts/release/activate-release.sh" "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
