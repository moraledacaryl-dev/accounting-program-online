name: Deploy Accounting

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character commit SHA from main to deploy'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release SHA input
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Prepare and activate exact release on server
        # v1.0.3 pinned to an immutable upstream commit for supply-chain integrity.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: RELEASE_SHA
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ROOT=/opt/accounting-program-online
            git -C "$ROOT" fetch --no-tags origin main
            git -C "$ROOT" cat-file -e "$RELEASE_SHA^{commit}"
            git -C "$ROOT" merge-base --is-ancestor "$RELEASE_SHA" origin/main
            BOOTSTRAP=/tmp/accounting-prepare-release-$RELEASE_SHA.sh
            git -C "$ROOT" show "$RELEASE_SHA:scripts/release/prepare-release.sh" > "$BOOTSTRAP"
            chmod 700 "$BOOTSTRAP"
            SOURCE_ROOT="$ROOT" bash "$BOOTSTRAP" "$RELEASE_SHA"
            rm -f "$BOOTSTRAP"
            bash "/opt/accounting-releases/$RELEASE_SHA/scripts/release/activate-release.sh" "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
