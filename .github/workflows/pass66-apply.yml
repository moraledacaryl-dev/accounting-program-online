name: Pass 66 guarded transaction patch

on:
  push:
    branches:
      - pass-66-transaction-integrity-concurrency
    paths:
      - scripts/pass66_apply.py
      - .github/workflows/pass66-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: Basic ${AUTH}" fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD

      - name: Apply guarded transaction patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/pass66_apply.py')
          text = p.read_text()

          replacements = [
              (
                  '''patch(cash,\n"    _update_receivable_balance(db, row.id)\\n    db.commit()\\n    db.refresh(row)\\n    return _serialize_receivable(row)",\n"    _update_receivable_balance(db, row.id)\\n    db.flush()\\n    if commit:\\n        db.commit()\\n        db.refresh(row)\\n    return _serialize_receivable(row)",\ncount=1)''',
                  '''patch(cash,\n"        external_id=external_id,\\n    )\\n    db.add(row)\\n    db.flush()\\n    _update_receivable_balance(db, row.id)\\n    db.commit()\\n    db.refresh(row)\\n    return _serialize_receivable(row)",\n"        external_id=external_id,\\n    )\\n    db.add(row)\\n    db.flush()\\n    _update_receivable_balance(db, row.id)\\n    db.flush()\\n    if commit:\\n        db.commit()\\n        db.refresh(row)\\n    return _serialize_receivable(row)")'''
              ),
              (
                  '''patch(cash,\n"    _update_payable_balance(db, row.id)\\n    db.commit()\\n    db.refresh(row)\\n    return _serialize_payable(row)",\n"    _update_payable_balance(db, row.id)\\n    db.flush()\\n    if commit:\\n        db.commit()\\n        db.refresh(row)\\n    return _serialize_payable(row)",\ncount=1)''',
                  '''patch(cash,\n"        bir_include=bool(payload.bir_include),\\n    )\\n    db.add(row)\\n    db.flush()\\n    _update_payable_balance(db, row.id)\\n    db.commit()\\n    db.refresh(row)\\n    return _serialize_payable(row)",\n"        bir_include=bool(payload.bir_include),\\n    )\\n    db.add(row)\\n    db.flush()\\n    _update_payable_balance(db, row.id)\\n    db.flush()\\n    if commit:\\n        db.commit()\\n        db.refresh(row)\\n    return _serialize_payable(row)")'''
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('pass66 patcher target drifted')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          python3 scripts/pass66_apply.py
          git diff --check
          python3 -m compileall -q backend/app

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app
          git commit -m "Pass 66: enforce atomic money workflows and row locks"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: Basic ${AUTH}" push origin "HEAD:${BRANCH}"
