name: Diagnose Production Routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live nginx and Accounting routing
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            echo '=== services ==='
            systemctl is-active accounting-backend accounting-frontend nginx || true
            echo '=== listeners ==='
            ss -ltnp | grep -E ':(80|443|8000|3000)\b' || true
            echo '=== effective nginx lines relevant to hiddenoasis/api/proxy ==='
            nginx -T 2>&1 | grep -nE 'server_name|location[[:space:]]+/?api|proxy_pass|limit_except|deny|return[[:space:]]+405' | sed -n '1,260p' || true
            echo '=== direct backend health ==='
            curl -sS -D - -o /dev/null http://127.0.0.1:8000/healthz | sed -n '1,20p'
            echo '=== direct backend JSON health ==='
            curl -fsS -D - http://127.0.0.1:8000/api/healthz | sed -n '1,20p'
            echo '=== public Accounting JSON health ==='
            curl -fsS -D - https://accounting.hiddenoasis.app/api/healthz | sed -n '1,20p'
            echo '=== public OPTIONS ==='
            curl -sS -D - -o /dev/null -X OPTIONS https://accounting.hiddenoasis.app/api/healthz || true
