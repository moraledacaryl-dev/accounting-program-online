name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cleanup/**'
      - 'recovery/**'
      - 'pass-*/**'
      - 'pass-*'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-accounting.db
      SECRET_KEY: ci-secret-key-do-not-use
      STARTUP_REQUIRE_MIGRATIONS: 'false'
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      ALLOW_DEMO_SEED: 'false'
    steps:
      - name: Check out repository without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Python runtime
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install backend dependencies
        working-directory: backend
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt pytest

      - name: Compile backend
        working-directory: backend
        run: python3 -m compileall -q app tests

      - name: Validate Alembic revision lengths
        working-directory: backend
        run: |
          python3 - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          scripts = ScriptDirectory.from_config(Config('alembic.ini'))
          invalid = [(revision.revision, len(revision.revision)) for revision in scripts.walk_revisions() if len(revision.revision) > 32]
          if invalid:
              raise SystemExit(f'Alembic revision IDs exceed PostgreSQL alembic_version VARCHAR(32): {invalid}')
          PY

      - name: Validate Alembic migration chain
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          rm -f ci-migration.db
          python3 -m alembic upgrade head
          python3 -m alembic current

      - name: Run backend tests
        working-directory: backend
        run: |
          rm -f ci-accounting.db
          python3 -m pytest tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          rm -rf .next
          npm run build

      - name: Smoke-test production frontend
        working-directory: frontend
        run: bash scripts/smoke-test.sh

      - name: Install pinned browser blocker tooling
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run dynamic-route browser blocker
        working-directory: frontend
        run: npx playwright test --config=playwright.config.js
