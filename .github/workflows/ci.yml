name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cleanup/**'
      - 'recovery/**'
      - 'pass-*/**'
      - 'pass-*'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-accounting.db
      SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      STARTUP_REQUIRE_MIGRATIONS: 'false'
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      ALLOW_DEMO_SEED: 'false'
    steps:
      - name: Check out repository without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Python runtime
        run: |
          python3 --version
          python3 -m pip --version

      - name: Validate Pass 72 final certification source contract
        run: bash scripts/validate-pass72-source.sh

      - name: Install locked backend dependencies
        working-directory: backend
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt pytest==9.1.1

      - name: Audit locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit -r requirements.lock.txt
          if python3 -m pip list --format=freeze | grep -Eiq '^(python-jose|ecdsa)=='; then
            echo 'Forbidden legacy JWT dependency detected.'
            python3 -m pip list --format=freeze | grep -Ei '^(python-jose|ecdsa)=='
            exit 1
          fi

      - name: Compile backend
        working-directory: backend
        run: python3 -m compileall -q app tests

      - name: Validate Alembic revision lengths
        working-directory: backend
        run: |
          python3 - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          scripts = ScriptDirectory.from_config(Config('alembic.ini'))
          invalid = [(revision.revision, len(revision.revision)) for revision in scripts.walk_revisions() if len(revision.revision) > 32]
          if invalid:
              raise SystemExit(f'Alembic revision IDs exceed PostgreSQL alembic_version VARCHAR(32): {invalid}')
          PY

      - name: Validate Alembic migration chain
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          rm -f ci-migration.db
          python3 -m alembic upgrade head
          python3 -m alembic current

      - name: Run backend tests from repository root
        run: bash scripts/test-backend.sh

  backend-postgresql:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accounting
          POSTGRES_PASSWORD: accounting
          POSTGRES_DB: accounting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounting -d accounting_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://accounting:accounting@127.0.0.1:5432/accounting_ci
      SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      STARTUP_REQUIRE_MIGRATIONS: 'false'
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      ALLOW_DEMO_SEED: 'false'
    steps:
      - name: Check out repository without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install locked backend dependencies
        working-directory: backend
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt pytest==9.1.1

      - name: Upgrade real PostgreSQL schema
        working-directory: backend
        run: |
          python3 -m alembic upgrade head
          python3 -m alembic current

      - name: Run PostgreSQL workflow, concurrency, and scale certification tests
        working-directory: backend
        run: python3 -m pytest tests/test_postgresql_ci.py tests/test_postgresql_transaction_concurrency.py tests/test_postgresql_transfer_mutation_concurrency_pass85.py tests/test_postgresql_subledger_edit_concurrency_pass86.py tests/test_postgresql_pass72_certification.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_INVENTORY_APP_URL: https://inventory.hiddenoasis.app
      NEXT_PUBLIC_POS_APP_URL: https://pos.hiddenoasis.app
      NEXT_PUBLIC_STAFF_PAYROLL_APP_URL: https://staff.hiddenoasis.app
      NEXT_PUBLIC_OPERATIONS_APP_URL: https://operations.hiddenoasis.app
    steps:
      - name: Check out repository without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Validate public application handoff URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          required = (
              'NEXT_PUBLIC_INVENTORY_APP_URL',
              'NEXT_PUBLIC_POS_APP_URL',
              'NEXT_PUBLIC_STAFF_PAYROLL_APP_URL',
              'NEXT_PUBLIC_OPERATIONS_APP_URL',
          )
          for key in required:
              value = os.environ.get(key, '').strip()
              parsed = urlparse(value)
              if parsed.scheme != 'https' or not parsed.netloc:
                  raise SystemExit(f'{key} must be an absolute https URL')
          print('Public application handoff URLs: PASS')
          PY

      - name: Validate Pass 70 UX source contract
        working-directory: frontend
        run: node scripts/validate-pass70-source.js

      - name: Build frontend
        working-directory: frontend
        run: |
          rm -rf .next
          npm run build

      - name: Smoke-test production frontend
        working-directory: frontend
        run: bash scripts/smoke-test.sh

      - name: Install pinned browser blocker tooling
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser regression blocker
        working-directory: frontend
        run: npx playwright test --config=playwright.config.js
