name: Accounting Journal Review Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dr/journal-review-production-smoke.py'
      - '.github/workflows/accounting-journal-review-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-journal-review-production-smoke
  cancel-in-progress: false

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed review schema and unauthorized access without writes
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: AUDIT_SHA
          command_timeout: 10m
          script: |
            set -euo pipefail
            umask 077
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SOURCE=/opt/accounting-program-online
            CURRENT=/opt/accounting-current
            test -L "$CURRENT"
            test -x "$CURRENT/backend/.venv/bin/python"
            test -f /etc/hiddenoasis/accounting-backend.env
            git -C "$SOURCE" fetch --no-tags origin main
            git -C "$SOURCE" cat-file -e "$AUDIT_SHA^{commit}"
            git -C "$SOURCE" merge-base --is-ancestor "$AUDIT_SHA" origin/main
            echo "REVIEW_CERTIFICATION: deployed_release=$(basename "$(readlink -f "$CURRENT")")"
            SCRIPT_FILE="$(mktemp /tmp/accounting-review-certification.XXXXXXXX.py)"
            trap 'rm -f "$SCRIPT_FILE"' EXIT
            git -C "$SOURCE" show "$AUDIT_SHA:scripts/dr/journal-review-production-smoke.py" > "$SCRIPT_FILE"
            test -s "$SCRIPT_FILE"
            set -a
            . /etc/hiddenoasis/accounting-backend.env
            set +a
            "$CURRENT/backend/.venv/bin/python" "$SCRIPT_FILE"
        env:
          AUDIT_SHA: ${{ github.sha }}
