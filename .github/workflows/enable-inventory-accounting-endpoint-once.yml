name: One-time Enable Inventory Accounting Endpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-inventory-accounting-endpoint-once.yml']
permissions:
  contents: read
concurrency:
  group: inventory-accounting-config
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Accounting readback and safely update Inventory worker endpoint
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ENV_FILE=/etc/hiddenoasis/inventory-backend.env
            TARGET=https://accounting.hiddenoasis.app
            test -f "$ENV_FILE"
            test "$(id -u)" = 0 || { echo "Root privileges required for protected environment file" >&2; exit 1; }
            set -a
            source "$ENV_FILE"
            set +a
            python3 - <<'PY'
            import json,os,urllib.request,urllib.error
            current=json.loads(os.environ.get("INTEGRATION_ENDPOINTS_JSON") or "{}")
            assert isinstance(current,dict), "Integration endpoints must be a mapping"
            assert os.environ.get("INTEGRATION_API_KEY"), "Accounting integration key missing"
            req=urllib.request.Request(
              "https://accounting.hiddenoasis.app/api/integration-review/service-status?source_event_id=integration-preflight-nonexistent",
              headers={"X-Integration-Api-Key":os.environ["INTEGRATION_API_KEY"]},
            )
            try:
                urllib.request.urlopen(req, timeout=12)
            except urllib.error.HTTPError as exc:
                if exc.code != 404:
                    raise RuntimeError(f"Accounting credential or endpoint preflight rejected: HTTP {exc.code}")
            else:
                raise RuntimeError("Unknown-event Accounting lookup did not return 404")
            print("ACCOUNTING AUTHENTICATED READ-ONLY PREFLIGHT: PASS")
            PY
            BACKUP="$ENV_FILE.pre-accounting-$(date -u +%Y%m%dT%H%M%SZ)"
            cp -a "$ENV_FILE" "$BACKUP"
            RESTORE_NEEDED=1
            trap 'if [[ "$RESTORE_NEEDED" == "1" ]]; then cp -a "$BACKUP" "$ENV_FILE"; systemctl restart hiddenoasis-inventory-worker.service || true; echo "INVENTORY ACCOUNTING CONFIG ROLLED BACK" >&2; fi' ERR
            python3 - <<'PY'
            import json,os,re,shlex,stat,tempfile
            from pathlib import Path
            target="https://accounting.hiddenoasis.app"
            path=Path("/etc/hiddenoasis/inventory-backend.env")
            old=json.loads(os.environ.get("INTEGRATION_ENDPOINTS_JSON") or "{}")
            assert isinstance(old,dict)
            updated=dict(old)
            updated["accounting"]=target
            value=shlex.quote(json.dumps(updated,separators=(",",":")))
            content=path.read_text()
            line=f"INTEGRATION_ENDPOINTS_JSON={value}"
            pattern=r"(?m)^(?:export[ \t]+)?INTEGRATION_ENDPOINTS_JSON[ \t]*=.*$"
            new,count=re.subn(pattern,lambda _:line,content)
            if count>1: raise RuntimeError("Multiple endpoint declarations: refusing ambiguous configuration")
            if not count:
                new=content.rstrip("\n")+"\n"+line+"\n"
            st=path.stat()
            fd,tmp=tempfile.mkstemp(prefix=".inventory-backend-accounting-",dir=str(path.parent))
            try:
                with os.fdopen(fd,"w") as f:
                    f.write(new)
                    f.flush()
                    os.fsync(f.fileno())
                os.chmod(tmp,stat.S_IMODE(st.st_mode))
                os.chown(tmp,st.st_uid,st.st_gid)
                os.replace(tmp,path)
            finally:
                if os.path.exists(tmp): os.unlink(tmp)
            print("INVENTORY ENDPOINT UPDATED (existing Operations endpoint preserved)")
            PY
            unset INTEGRATION_ENDPOINTS_JSON
            set -a
            source "$ENV_FILE"
            set +a
            python3 - <<'PY'
            import json,os
            routes=json.loads(os.environ.get("INTEGRATION_ENDPOINTS_JSON") or "{}")
            assert routes.get("accounting")=="https://accounting.hiddenoasis.app"
            assert os.environ.get("INTEGRATION_API_KEY")
            print("INVENTORY ENDPOINT ENVIRONMENT VALIDATION: PASS")
            PY
            systemctl restart hiddenoasis-inventory-worker.service
            sleep 4
            systemctl is-active --quiet hiddenoasis-inventory-worker.service
            curl -fsS http://127.0.0.1:8300/api/v1/ready
            RESTORE_NEEDED=0
            trap - ERR
            echo
            echo "INVENTORY ACCOUNTING INTEGRATION CONFIG: PASS | worker active | private pre-change backup retained"
