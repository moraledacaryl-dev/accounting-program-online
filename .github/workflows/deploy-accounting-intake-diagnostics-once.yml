name: One-time Accounting Intake Diagnostics Certified Release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: one-time-accounting-intake-diagnostics
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Prove one-time bridge and certified exact Accounting release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_SHA: dfa25b5047b84f0cc8d6edf6029944b80a334009
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$TRIGGER_SHA" ]] || { echo "Main moved; refusing stale bridge" >&2; exit 1; }
          first_parent="$(gh api "repos/$GH_REPO/commits/$TRIGGER_SHA" --jq '.parents[0].sha')"
          [[ "$first_parent" == "$RELEASE_SHA" ]] || { echo "Not the one-time bridge merge; refusing deployment" >&2; exit 1; }
          relation="$(gh api "repos/$GH_REPO/compare/$RELEASE_SHA...$TRIGGER_SHA" --jq '.status')"
          [[ "$relation" == "ahead" ]] || { echo "Exact release ancestry not confirmed" >&2; exit 1; }
          mapfile -t release_ci < <(
            gh api --paginate "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" \
              --jq '.workflow_runs[] | [.status, (.conclusion // "")] | @tsv'
          )
          certified=no
          for row in "${release_ci[@]}"; do
            if [[ "$row" == $'completed\tsuccess' ]]; then certified=yes; break; fi
          done
          [[ "$certified" == yes ]] || { echo "No successful exact-feature push CI" >&2; exit 1; }
          echo "Certified feature release SHA: $RELEASE_SHA"

      - name: Activate Accounting exact SHA with mandatory preflight and backup
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: RELEASE_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ROOT=/opt/accounting-program-online
            git -C "$ROOT" fetch --no-tags origin main
            git -C "$ROOT" cat-file -e "$RELEASE_SHA^{commit}"
            git -C "$ROOT" merge-base --is-ancestor "$RELEASE_SHA" origin/main
            # Disk exhaustion previously blocked pg_dump after an expensive build.
            # Check capacity and a writable primary before any prepare or activation.
            BACKUPS=/var/backups/hiddenoasis/accounting
            mkdir -p "$BACKUPS"
            FREE_BYTES="$(df -B1 --output=avail "$BACKUPS" | tail -n 1 | tr -d ' ')"
            echo "Available bytes for mandatory database backup: $FREE_BYTES"
            if [ "$FREE_BYTES" -lt 4294967296 ]; then
              echo "Deployment blocked: less than 4 GiB available; preserve backups and free space safely." >&2
              exit 1
            fi
            pg_isready -h 127.0.0.1 -p 5432
            IN_RECOVERY="$(sudo -u postgres psql -d postgres -Atqc 'SELECT pg_is_in_recovery()')"
            if [ "$IN_RECOVERY" != "f" ]; then
              echo "Deployment blocked: PostgreSQL not confirmed as writable primary." >&2
              exit 1
            fi

            RELEASE="/opt/accounting-releases/$RELEASE_SHA"
            if [ -e "$RELEASE" ] || [ -L "$RELEASE" ]; then
              # The previous deployment may have built the complete immutable
              # release but failed at its mandatory pre-activation backup.
              # Never overwrite or erase it. Only reuse an exact, fully
              # verified SHA/config/dependency/build artifact.
              test -d "$RELEASE"
              test ! -L "$RELEASE"
              echo "Prepared release already exists; verifying exact identity without rebuilding."
              bash "$RELEASE/scripts/release/verify-release.sh" "$RELEASE_SHA"
            else
              BOOTSTRAP="/tmp/accounting-prepare-release-$RELEASE_SHA.sh"
              trap 'rm -f "$BOOTSTRAP"' EXIT
              git -C "$ROOT" show "$RELEASE_SHA:scripts/release/prepare-release.sh" > "$BOOTSTRAP"
              chmod 700 "$BOOTSTRAP"
              SOURCE_ROOT="$ROOT" bash "$BOOTSTRAP" "$RELEASE_SHA"
              rm -f "$BOOTSTRAP"
              trap - EXIT
            fi
            # activate-release.sh independently verifies the SHA and always
            # runs the mandatory database + uploads backup before migration.
            bash "$RELEASE/scripts/release/activate-release.sh" "$RELEASE_SHA"
        env:
          RELEASE_SHA: dfa25b5047b84f0cc8d6edf6029944b80a334009
