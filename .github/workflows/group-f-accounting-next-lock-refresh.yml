name: One-time Accounting Next.js Security Lock Refresh
on:
  push:
    branches: [ops/inventory-group-f-certified-release-20261023]
    paths:
      - '.github/workflows/group-f-accounting-next-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/inventory-group-f-certified-release-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh genuine patched Next.js lockfile
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --save-exact next@16.4.2 --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json");const l=require("./package-lock.json");if(p.dependencies.next!=="16.4.2"||l.packages["node_modules/next"].version!=="16.4.2")process.exit(1)'
      - name: Commit audited dependency update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Accounting Next.js to patched 16.4.2"
            git push origin HEAD:ops/inventory-group-f-certified-release-20261023
          fi
